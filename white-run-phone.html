<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Q 3D white-run phone</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f5f5f5;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:10px;right:12px;z-index:5;pointer-events:none;color:#222;font-size:13px;text-shadow:0 1px 0 #fff}
#err{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#300;color:#fcc;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto}
#stick{position:fixed;width:132px;height:132px;z-index:6;left:16px;bottom:24px;opacity:0;pointer-events:none}
#stick.active{opacity:.92}
.stick-base{width:100%;height:100%;border-radius:50%;border:2px solid #888;background:rgba(0,0,0,.08);position:relative}
#stick-knob{width:54px;height:54px;border-radius:50%;background:#222;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
<script type="importmap">
{"imports":{
  "three":"https://fung2222.github.io/neon-swarm/vendor/cyber-kit/three/three.module.min.js",
  "three/addons/":"https://fung2222.github.io/neon-swarm/vendor/cyber-kit/three/addons/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>Q 3D white-run</b> · root phone entry · tip untouched · build walk3</div>
  <div id="status">boot…</div>
  <div>Phone: press &amp; drag left half → move</div>
</div>
<div id="stick"><div class="stick-base"><div id="stick-knob"></div></div></div>
<div id="err"></div>
<script>
window.addEventListener('error',e=>{const el=document.getElementById('err');el.style.display='block';el.textContent=String(e.error||e.message);document.getElementById('status').textContent='load failed';});
window.addEventListener('unhandledrejection',e=>{const el=document.getElementById('err');el.style.display='block';el.textContent=String(e.reason);document.getElementById('status').textContent='load failed';});
</script>
<script type="module" src="https://fung2222.github.io/neon-swarm/prototypes/q-3d-white-run/main.phone.js?v=walk3"></script>
</body>
</html>
