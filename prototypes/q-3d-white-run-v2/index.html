<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Q 3D white-run v2 proto — touch move</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #f5f5f5; font-family: system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top, 0px));
      right: 12px; z-index: 5; pointer-events: none;
      color: #222; font-size: 13px; line-height: 1.35;
      text-shadow: 0 1px 0 #fff, 0 0 8px #fff;
    }
    #hud b { font-weight: 700; }
    #status { opacity: 0.85; }
    #stick {
      position: fixed; width: 132px; height: 132px; z-index: 6;
      left: calc(16px + env(safe-area-inset-left, 0px));
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      opacity: 0; pointer-events: none; transition: opacity 100ms ease;
    }
    #stick.active { opacity: 0.92; }
    #stick.ready-hint {
      opacity: 0.35;
      left: calc(16px + env(safe-area-inset-left, 0px));
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: auto; top: auto;
    }
    .stick-base {
      width: 100%; height: 100%; border-radius: 50%;
      background: rgba(0,0,0,0.12); border: 2px solid rgba(0,0,0,0.28);
      position: relative;
    }
    #stick-knob {
      position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
      margin: -27px 0 0 -27px; border-radius: 50%;
      background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.65);
      transform: translate(0px, 0px); will-change: transform;
    }
    #err {
      display: none; position: fixed; inset: 12px; z-index: 10;
      background: #fff; color: #b00020; border: 1px solid #fcc;
      border-radius: 10px; padding: 14px; overflow: auto; white-space: pre-wrap;
      font: 12px/1.4 ui-monospace, monospace; pointer-events: auto;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/cyber-kit/three/three.module.min.js",
      "three/addons/": "../../vendor/cyber-kit/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div><b>Q 3D white-run v2</b> · prototype only · tip untouched · build v2</div>
    <div id="status">loading…</div>
    <div>Phone: press &amp; drag left half → move. Desktop: WASD / arrows.</div>
  </div>
  <div id="stick" aria-hidden="true">
    <div class="stick-base"><div id="stick-knob"></div></div>
  </div>
  <div id="err"></div>
  <script>
    // Surface module-graph failures (e.g. 404 import) — otherwise HUD stays on "loading…" forever.
    (function () {
      var errEl = document.getElementById('err');
      var statusEl = document.getElementById('status');
      function boom(msg) {
        console.error(msg);
        if (statusEl) statusEl.textContent = 'load failed — see error panel';
        if (!errEl) return;
        errEl.style.display = 'block';
        errEl.textContent = String(msg && msg.stack ? msg.stack : msg);
      }
      window.addEventListener('error', function (e) {
        boom(e && (e.error || e.message) || 'script error');
      });
      window.addEventListener('unhandledrejection', function (e) {
        boom(e && e.reason ? e.reason : 'unhandledrejection');
      });
    })();
  </script>
  <script type="module" src="./main.js?v=1"></script>
</body>
</html>
