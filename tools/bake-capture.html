<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bake-mech-sprites capture</title>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "../vendor/cyber-kit/three/addons/"
  }
}
</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildPlayerMech } from '../js/mech-builder.js';
import { MECH_BY_ID } from '../js/config.js';

const DIRS4 = ['n', 'e', 's', 'w'];
const DIRS8 = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
// Mech default rifle points +Z; camera sits on +Z looking at origin → yaw 0 = front (n).
// Bake yaw turns silhouette toward camera (opposite sense from gameplay FACE_YAW on E/W).
const DIR_YAW = {
  n: 0, ne: -Math.PI / 4, e: -Math.PI / 2, se: -3 * Math.PI / 4,
  s: Math.PI, sw: 3 * Math.PI / 4, w: Math.PI / 2, nw: Math.PI / 4,
};

const params = new URLSearchParams(location.search);
const SIZE = Math.max(64, Number(params.get('size') || 256));
const ID = params.get('id') || 'horn';
const FRAMES = Math.max(1, Number(params.get('frames') || 4));
const DIR_COUNT = Number(params.get('dirs') || 4) === 8 ? 8 : 4;
const DIRS = DIR_COUNT === 8 ? DIRS8 : DIRS4;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance',
});
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// v0.9.7: clearer plate read without wash — stronger key + cyan rim, restrained hemi
const hemi = new THREE.HemisphereLight(0xa8b8ff, 0x120818, 0.85);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(2.4, 4.8, 3.4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6aa8ff, 0.55);
fill.position.set(-3.2, 2.2, -1.8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00e5ff, 0.75);
rim.position.set(-0.4, 2.8, -3.4);
scene.add(rim);
const kick = new THREE.DirectionalLight(0xb060ff, 0.22);
kick.position.set(1.5, 1.2, 2.5);
scene.add(kick);

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 40);
const elev = (60 * Math.PI) / 180;
const dist = 4.1;
camera.position.set(0, Math.sin(elev) * dist, Math.cos(elev) * dist);
camera.lookAt(0, 0.88, 0);

const cfg = MECH_BY_ID[ID] || MECH_BY_ID.horn;
let mech = null;

function resetMech() {
  if (mech) {
    scene.remove(mech);
    mech.traverse((o) => {
      if (o.geometry) o.geometry.dispose?.();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose?.());
        else o.material.dispose?.();
      }
    });
  }
  mech = buildPlayerMech(cfg);
  if (mech.userData.halo) mech.userData.halo.visible = false;
  mech.position.set(0, 0, 0);
  scene.add(mech);
  return mech;
}

function poseIdle() {
  const ud = mech.userData;
  for (const leg of ud.legs || []) leg.rotation.x = 0;
  for (const shin of ud.shins || []) shin.rotation.x = 0;
  for (const foot of ud.foots || []) foot.rotation.x = 0;
  for (const arm of ud.arms || []) { arm.rotation.x = 0; arm.rotation.z = 0; }
  if (ud.body) { ud.body.position.y = 0; ud.body.rotation.x = 0; }
  if (ud.head) { ud.head.rotation.x = 0; }
}

function poseRun(frame, frames) {
  poseIdle();
  const t = (frame / frames) * Math.PI * 2;
  const swing = Math.sin(t);
  const swingOpp = Math.sin(t + Math.PI);
  const ud = mech.userData;
  if (ud.legs?.length === 2) {
    ud.legs[0].rotation.x = swing * 0.55;
    ud.legs[1].rotation.x = swingOpp * 0.55;
  }
  if (ud.shins?.length === 2) {
    ud.shins[0].rotation.x = Math.max(0, -swing) * 0.35;
    ud.shins[1].rotation.x = Math.max(0, -swingOpp) * 0.35;
  }
  if (ud.foots?.length === 2) {
    ud.foots[0].rotation.x = swing * 0.25;
    ud.foots[1].rotation.x = swingOpp * 0.25;
  }
  if (ud.arms?.length === 2) {
    ud.arms[0].rotation.x = swingOpp * 0.35;
    ud.arms[1].rotation.x = swing * 0.25 - 0.15; // rifle arm slight aim
  }
  if (ud.body) ud.body.position.y = Math.abs(Math.sin(t)) * 0.02;
}

function poseHurt() {
  poseIdle();
  const ud = mech.userData;
  if (ud.body) { ud.body.rotation.x = 0.12; ud.body.position.y = -0.02; }
  if (ud.arms?.length === 2) {
    ud.arms[0].rotation.x = -0.55;
    ud.arms[1].rotation.x = -0.4;
  }
  if (ud.head) ud.head.rotation.x = 0.2;
  // Tint hot mats reddish for hurt overlay bake
  for (const mat of [...(ud.hullMats || []), ...(ud.coreMats || [])]) {
    if (mat?.emissive) mat.emissive.setHex(0xff4466);
    if (mat) mat.emissiveIntensity = (mat.emissiveIntensity || 0.4) + 0.6;
  }
}

function poseDeath() {
  poseIdle();
  const ud = mech.userData;
  if (ud.body) { ud.body.rotation.x = 0.55; ud.body.position.y = -0.08; }
  if (ud.legs?.length === 2) {
    ud.legs[0].rotation.x = 0.9;
    ud.legs[1].rotation.x = 1.1;
  }
  if (ud.arms?.length === 2) {
    ud.arms[0].rotation.x = 0.8;
    ud.arms[1].rotation.x = 1.0;
  }
  if (ud.head) ud.head.rotation.x = 0.45;
}

/**
 * Layer split for compositing without double-draw:
 *  lower/body: legs + waist/chest/pack (no arms, no head)
 *  gun: arms (+rifle) + head only
 *  full: everything (hurt/death)
 */
function setLayer(mode) {
  const ud = mech.userData;
  if (ud.halo) ud.halo.visible = false;
  const armSet = new Set(ud.arms || []);
  const legSet = new Set(ud.legs || []);
  const kids = ud.body ? ud.body.children : [];
  if (mode === 'lower' || mode === 'body') {
    for (const child of kids) {
      child.visible = !armSet.has(child) && child !== ud.head;
    }
  } else if (mode === 'gun') {
    for (const child of kids) {
      child.visible = armSet.has(child) || child === ud.head;
    }
    if (ud.arms?.length === 2) {
      ud.arms[0].rotation.x = -0.1;
      ud.arms[1].rotation.x = -0.4;
    }
  } else {
    // full
    for (const child of kids) child.visible = true;
  }
}

function capture() {
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

/** Shared fallback UV — used only if muzzle mesh missing. */
function muzzleAnchorNorm() {
  return { foot: [0.5, 0.92], pivot: [0.5, 0.52], muzzle: [0.68, 0.48] };
}

/**
 * Bake yaw turns the silhouette toward the fixed camera.
 * Face yaw aims the rifle the way gameplay does (+Z=n, +X=e) for muzzleWorld.
 */
const FACE_YAW = {
  n: 0, ne: Math.PI / 4, e: Math.PI / 2, se: 3 * Math.PI / 4,
  s: Math.PI, sw: -3 * Math.PI / 4, w: -Math.PI / 2, nw: -Math.PI / 4,
};

function poseGunAim() {
  setLayer('gun');
  poseIdle();
  if (mech.userData.arms?.length === 2) {
    mech.userData.arms[1].rotation.x = -0.4;
  }
  mech.updateMatrixWorld(true);
}

function findMuzzleTip() {
  let tip = null;
  mech.traverse((o) => { if (o.name === 'muzzle') tip = o; });
  return tip;
}

/** World pos of cylinder muzzle end (height along local Y). */
function muzzleWorldPos(tip) {
  const end = new THREE.Vector3(0, 0.03, 0);
  tip.localToWorld(end);
  return end;
}

/** UV for sprite cell: tip projected while bake-yawed toward camera. */
function projectMuzzleUv(dir) {
  resetMech();
  mech.rotation.y = DIR_YAW[dir];
  poseGunAim();
  const tip = findMuzzleTip();
  const foot = [0.5, 0.92];
  const pivot = [0.5, 0.52];
  if (!tip) return { foot, pivot, muzzle: [0.68, 0.48] };
  camera.updateMatrixWorld(true);
  const world = muzzleWorldPos(tip);
  const ndc = world.clone().project(camera);
  const u = (ndc.x + 1) / 2;
  const v = (1 - ndc.y) / 2;
  return {
    foot,
    pivot,
    muzzle: [Number(u.toFixed(4)), Number(v.toFixed(4))],
  };
}

/** Gameplay world offset: tip while mech faces aim cardinal. */
function projectMuzzleWorld(dir) {
  resetMech();
  mech.rotation.y = FACE_YAW[dir];
  poseGunAim();
  const tip = findMuzzleTip();
  if (!tip) return [0, 0.95, 0.72];
  const world = muzzleWorldPos(tip);
  return [Number(world.x.toFixed(4)), Number(world.y.toFixed(4)), Number(world.z.toFixed(4))];
}

function projectMuzzle(dir) {
  const uv = projectMuzzleUv(dir);
  return { ...uv, muzzleWorld: projectMuzzleWorld(dir) };
}

async function bakeAll() {
  const cells = [];
  const anchorsByDir = {};
  const muzzleWorldByDir = {};
  for (const dir of DIRS) {
    const a = projectMuzzle(dir);
    anchorsByDir[dir] = { foot: a.foot, pivot: a.pivot, muzzle: a.muzzle };
    muzzleWorldByDir[dir] = a.muzzleWorld;
  }
  const anchors = { ...muzzleAnchorNorm(), muzzle: anchorsByDir.n.muzzle };

  function add(dir, action, frame, layer, dataUrl) {
    const a = anchorsByDir[dir] || anchors;
    cells.push({
      dir, action, frame, layer,
      file: `${ID}_${dir}_${action}_${String(frame).padStart(2, '0')}${layer !== 'body' ? '_' + layer : ''}.png`,
      dataUrl,
      anchors: { ...a, muzzleWorld: muzzleWorldByDir[dir] },
    });
  }

  // Body: idle + run + hurt + death per dir (+ independent gun layer)
  for (const dir of DIRS) {
    resetMech();
    mech.rotation.y = DIR_YAW[dir];
    setLayer('body');
    poseIdle();
    add(dir, 'idle', 0, 'body', capture());

    for (let f = 0; f < FRAMES; f++) {
      resetMech();
      mech.rotation.y = DIR_YAW[dir];
      setLayer('body');
      poseRun(f, FRAMES);
      add(dir, 'run', f, 'body', capture());
    }

    resetMech();
    mech.rotation.y = DIR_YAW[dir];
    setLayer('full');
    poseHurt();
    add(dir, 'hurt', 0, 'body', capture());

    resetMech();
    mech.rotation.y = DIR_YAW[dir];
    setLayer('full');
    poseDeath();
    add(dir, 'death', 0, 'body', capture());

    // Independent gun / upper aim layer (same yaw = aim dir)
    resetMech();
    mech.rotation.y = DIR_YAW[dir];
    setLayer('gun');
    poseIdle();
    if (mech.userData.arms?.length === 2) {
      mech.userData.arms[1].rotation.x = -0.4;
    }
    add(dir, 'gun', 0, 'gun', capture());
  }

  

  window.__BAKE_RESULT__ = {
    version: '0.9.27',
    implemented: true,
    source: 'buildPlayerMech (js/mech-builder.js)',
    id: ID,
    size: SIZE,
    dirs: DIRS,
    frames: FRAMES,
    characterHeightFrac: 0.75,
    camera: { elevationDeg: 60, fov: 28, dist },
    anchors,
    anchorsByDir,
    muzzleWorldByDir,
    cells: cells.map(({ dataUrl, ...meta }) => meta),
    // data kept parallel for puppeteer extraction
    _dataUrls: cells.map((c) => c.dataUrl),
  };
  document.title = 'BAKE_READY';
  return window.__BAKE_RESULT__;
}

resetMech();
bakeAll().then((r) => {
  console.log('[bake-capture] cells', r.cells.length);
}).catch((e) => {
  console.error(e);
  document.title = 'BAKE_ERROR';
  window.__BAKE_ERROR__ = String(e && e.stack || e);
});
</script>
</body>
</html>
